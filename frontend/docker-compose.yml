version: "3.1"
services:
  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 30
  app:
    container_name: bachelors-frontend
    image: tretiakovv/bachelor_frontend:frontend-dev
    ports:
      - "3001:3000"
    networks:
    - app-network
networks:
  app-network:
    driver: bridge